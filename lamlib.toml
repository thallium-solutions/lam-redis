[library]
name = "@lam/redis"
version = "2.0.2"
description = "Result-first Redis client with strings, JSON, collections, pub/sub, and typed pipelines"
license = "Apache-2.0"
authors = ["Lammergeier contributors"]
repository = "https://github.com/thallium-solutions/lam-redis"
homepage = "https://github.com/thallium-solutions/lam-redis"

[compatibility]
lamc = ">=1.18, <4"

[go-deps]
"github.com/redis/go-redis/v9" = "v9.19.0"

[scripts]
test = "python3 tests/run_lamredis_tests.py --verbose"
format = "lamc fmt ."
service = "sh test-services.sh"
